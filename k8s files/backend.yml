apiVersion: apps/v1
kind: Deployment
metadata:
  name: laurus-backend-deployment
  namespace: laurus-apps
  labels:
    app: laurus-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: laurus-backend
  template:
    metadata:
      labels:
        app: laurus-backend
    spec:
      containers:
        - name: laurus-backend
          image: sueesh144/laurus-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: laurus-global-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: laurus-db-secret
                  key: MONGODB_URI
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: laurus-backend-service
  namespace: laurus-apps
spec:
  selector:
    app: laurus-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP