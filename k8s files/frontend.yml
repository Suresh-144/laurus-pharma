apiVersion: apps/v1
kind: Deployment
metadata:
  name: laurus-frontend-deployment
  namespace: laurus-apps
  labels:
    app: laurus-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: laurus-frontend
  template:
    metadata:
      labels:
        app: laurus-frontend
    spec:
      containers:
        - name: laurus-frontend
          image: sueesh144/laurus-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: laurus-global-config
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: laurus-frontend-service
  namespace: laurus-apps
spec:
  selector:
    app: laurus-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP